<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Ventas</title>
  <link rel="stylesheet" href="/src/css/estilos-admin.css">
  <link rel="icon" href="image/logoCaris.jpg" type="image/png">
</head>
<body>
  <header>
    <h1>TACOS CARISMMA</h1>
  </header>

  <!-- <nav>
    <a href="menu.html">Menú</a>
    <a href="index.html">Orden</a>
    <a href="admin.html">Administrar</a>
  </nav> -->

    <nav id="menuNavegacion">
    <a href="https://tacos-carissma.web.app/menu.html">Menú</a>
    <a href="https://tacos-carissma.web.app/index.html">Orden</a>
    <a href="https://tacos-carissma.web.app/admin.html">Administrar</a>

  <div id="login-container">
  <button id="btnLogin">Iniciar sesión como administrador</button>
  </div>

  <div id="contenido-app" style="display: none;">
  <main>
    <section id="busquedaVentas">
      <h2>Ventas por fecha</h2>

      <div class="form-group">
        <label for="selectorFecha">Selecciona una fecha:</label>
        <input type="date" id="selectorFecha">
      </div>

      <button id="btnBuscarVenta">Buscar Ventas</button>
    </section>

    <section id="resultadoVentas">
      <div id="resultadoVenta"></div>
      <ol id="listaVentas"></ol>
    </section>

    <section id="graficoFinesSemana">
      <h2>Gráfico de ventas por fin de semana</h2>
      <div id="graficoMensaje" class="grafico-mensaje">Cargando gráfico de fines de semana...</div>
      <div class="chart-scroll-wrapper">
        <div class="chart-inner">
          <canvas id="weekendSalesChart" width="800" height="360"></canvas>
        </div>
      </div>
      <ol id="listaFinesSemana"></ol>
    </section>
  </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script type="module" src="/src/ts/appAdm.ts"></script>
</body>
</html>
