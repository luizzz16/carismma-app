<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carismma</title>
  <link rel="stylesheet" href="/src/css/estilos-orden.css">
</head>
<body>
  <header>
    <h1>TACOS CARISMMA</h1>
  </header>

  <!-- <nav>
    <a href="menu.html">Menú</a>
    <a href="index.html">Orden</a>
    <a href="admin.html">Administrar</a>
  </nav> -->

    <nav id="menuNavegacion">
    <a href="https://tacos-carissma.web.app/menu.html">Menú</a>
    <a href="https://tacos-carissma.web.app/index.html">Orden</a>
    <a href="https://tacos-carissma.web.app/admin.html">Administrar</a>
  </nav>

  <div id="login-container">
  <button id="btnLogin">Iniciar sesión con Google</button>
  </div>
  <div id="contenido-app" style="display: none;">
  <main>
    <form id="ordenForm">
      <h2>Ordenar</h2>

      

      <div class="form-group">
        <label for="noMesa">Número de mesa:</label>
        <input type="text" id="noMesa">
      </div>

      <div class="form-group">
        <label for="nombreCliente">Nombre cliente:</label>
        <input type="text" id="nombreCliente" placeholder="Nombre del cliente">
      </div>

      <div class="form-group">
        <label for="fechaOrden">Fecha:</label>
        <input type="date" id="fechaOrden">
      </div>

      <button type="button" id="agregarOrden">Crear Nueva Orden</button>
      <!-- <button type="button" id="agregarOrdenParaLlevar">Crear Nueva Orden Para Llevar</button> -->

      <div class="form-group">
        <label for="SelectorNoMesa">Seleccione mesa:</label>
        <select id="SelectorNoMesa"></select>
      </div>

      <!-- <div class="form-group">
      <label for="selectCliente">Seleccione cliente:</label>
      <select id="selectCliente"></select>
      </div> -->


      <h3 id="formatoOrden"></h3>

      <div class="form-group">
        <label for="especificaciones">Especificaciones:</label>
        <textarea id="especificaciones" rows="4" placeholder="Escriba aquí las especificaciones de la orden"></textarea>
        <button type="button" id="mostrarEspecificaciones">Guardar especificaciones</button>
      </div>

      <div class="form-group">
        <label>SubOrdenes:</label>
        <ol id="listaSubOrdenes"></ol>
      </div>

      <section class="seccion">
        <h3>Tacos</h3>
        <div class="form-group"><label for="puerco">Carne de puerco ($14):</label><input type="number" id="puerco" min="0" placeholder="0"></div>
        <div class="form-group"><label for="chicharron">Chicharrón ($14):</label><input type="number" id="chicharron" min="0" placeholder="0"></div>
        <div class="form-group"><label for="papa">Papa ($14):</label><input type="number" id="papa" min="0" placeholder="0"></div>
        <div class="form-group"><label for="frijol">Frijol ($14):</label><input type="number" id="frijol" min="0" placeholder="0"></div>
        <div class="form-group"><label for="mixtosT">Mixtos ($18):</label><input type="number" id="mixtosT" min="0" placeholder="0"></div>
      </section>

      <section class="seccion">
        <h3>Entamalados</h3>
        <div class="form-group"><label for="entamaladoR">Carne de res ($38):</label><input type="number" id="entamaladoR" min="0" placeholder="0"></div>
        <div class="form-group"><label for="entamaladoF">Frijol ($30):</label><input type="number" id="entamaladoF" min="0" placeholder="0"></div>
        <div class="form-group"><label for="entamaladoM">Mixto ($38):</label><input type="number" id="entamaladoM" min="0" placeholder="0"></div>
      </section>

      <section class="seccion">
        <h3>Bebidas</h3>
        <div class="form-group"><label for="aguaSG">Agua de jamaica G ($30):</label><input type="number" id="aguaSGj" min="0" placeholder="0"></div>
        <div class="form-group"><label for="aguaSG">Agua de horchata G ($30):</label><input type="number" id="aguaSGh" min="0" placeholder="0"></div>
        <div class="form-group"><label for="aguaSCH">Agua de jamaica CH ($15):</label><input type="number" id="aguaSCHj" min="0" placeholder="0"></div>
        <div class="form-group"><label for="aguaSCH">Agua de horchata CH ($15):</label><input type="number" id="aguaSCHh" min="0" placeholder="0"></div>
        <div class="form-group"><label for="bolsaAguaJ">Bolsa de agua jamaica ($20):</label><input type="number" id="bolsaAguaJ" min="0" placeholder="0"></div>
        <div class="form-group"><label for="bolsaAguaH">Bolsa de agua horchata ($20):</label><input type="number" id="bolsaAguaH" min="0" placeholder="0"></div>
        <div class="form-group"><label for="refresco">Refresco ($30):</label><input type="number" id="refresco" min="0" placeholder="0"></div>
        <div class="form-group"><label for="refresco">Refresco 600 ml ($32):</label><input type="number" id="refresco600ml" min="0" placeholder="0"></div>
        <div class="form-group"><label for="cafe">Café ($30):</label><input type="number" id="cafe" min="0" placeholder="0"></div>
        <div class="form-group"><label for="aguaBG">Agua embotellada G ($20):</label><input type="number" id="aguaBG" min="0" placeholder="0"></div>
        <div class="form-group"><label for="aguaBCH">Agua embotellada CH ($15):</label><input type="number" id="aguaBCH" min="0" placeholder="0"></div>
      </section>

      <div class="form-group">
        <label for="especificacionesSub">Especificaciones de la subOrden:</label>
        <input type="text" id="especificacionesSub" placeholder="Escriba aquí las especificaciones de la subOrden">
      </div>

      <button type="button" id="crearSubOrden">Crear subOrden</button>
      <button type="button" id="crearSubOrdenEnNuevaOrden">Crear subOrden en nueva orden</button>
    </form>

    <section>
      <h2 class="titulo-ordenes">Órdenes Creadas</h2>
      <ol id="ordenesCreadas"></ol>
    </section>

    <section id="ordenesLista">
      <h2>Órdenes Pagadas</h2>
      <input type="date" id="fechaOrdenPagada">
      <button id="btnBuscarOrdenPagada">Buscar</button>
      <ol id="ordenesPagadas"></ol>
    </section>
  </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script type="module" src="/src/ts/app.ts"></script>
</body>
</html>
